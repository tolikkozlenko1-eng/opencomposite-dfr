name: Publish release
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-parts/publish.sh
