name: Clean release parts
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tolikkozlenko1-eng"
          git config user.email "tolikkozlenko1@gmail.com"
          git rm -r release-parts
          git rm .github/workflows/publish-release.yml
          git commit -m "Remove the temporary release parts."
          git push
